<!DOCTYPE html>
<html lang="en" data-dr-expect="dark" data-dr-settle="1400">

<head>
  <meta charset="utf-8">
  <title>Darkrai fixture: small dark icons</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #ffffff;
      color: #222222;
      font: 15px/1.6 system-ui, sans-serif;
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: 560px;
      padding: 12px 14px;
      background: #ffffff;
      border: 1px solid #e0e0e0;
    }

    .bar svg {
      width: 22px;
      height: 22px;
    }

    .dark-fill {
      fill: #111111;
    }

    .grey-fill {
      fill: #9e9e9e;
    }

    .brand-fill {
      fill: #0b5fff;
    }

    .stroked {
      fill: none;
      stroke: #222222;
      stroke-width: 2;
    }

    .photo {
      margin-top: 14px;
    }
  </style>
  <script>window.__DR_SHIM__ = {};</script>
  <script src="../shim/chrome-shim.js"></script>
</head>

<body>
  <h1>Icons that usually disappear</h1>

  <div class="bar">
    <svg viewBox="0 0 24 24" aria-label="Filled dark icon" role="img">
      <rect class="dark-fill" x="3" y="3" width="18" height="18" rx="3"></rect>
    </svg>
    <svg viewBox="0 0 24 24" aria-label="Grey icon" role="img">
      <circle class="grey-fill" cx="12" cy="12" r="9"></circle>
    </svg>
    <svg viewBox="0 0 24 24" aria-label="Brand icon" role="img">
      <path class="brand-fill" d="M12 2 2 22h20z"></path>
    </svg>
    <svg viewBox="0 0 24 24" aria-label="Outlined icon" role="img">
      <circle class="stroked" cx="12" cy="12" r="8"></circle>
    </svg>
    <svg viewBox="0 0 24 24" aria-label="Inline fill icon" role="img">
      <rect fill="#1b1b1b" x="4" y="4" width="16" height="16"></rect>
    </svg>
    <span>Toolbar labels</span>
  </div>

  <p class="photo">
    <!-- An inline SVG data URI stands in for a photo: it must not be inverted. -->
    <img width="120" height="60" alt="A stand-in photo"
      src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22120%22%20height%3D%2260%22%3E%3Crect%20width%3D%22120%22%20height%3D%2260%22%20fill%3D%22%23e53935%22%2F%3E%3Ccircle%20cx%3D%2290%22%20cy%3D%2218%22%20r%3D%2210%22%20fill%3D%22%23ffeb3b%22%2F%3E%3C%2Fsvg%3E">
  </p>

  <script src="../../extension/shared/timing.js"></script>
  <script src="../../extension/shared/color.js"></script>
  <script src="../../extension/shared/settings.js"></script>
  <script src="../../extension/shared/restricted.js"></script>
  <script src="../../extension/content/detect.js"></script>
  <script src="../../extension/content/engine-smart.js"></script>
  <script src="../../extension/content/engine-simple.js"></script>
  <script src="../../extension/content/readability.js"></script>
  <script src="../../extension/content/icons.js"></script>
  <script src="../../extension/content/picker.js"></script>
  <script src="../../extension/content/main.js"></script>
  <script>
    window.__DR_EXTRA_CHECKS__ = function (api) {
      var img = document.querySelector('img');
      var filter = getComputedStyle(img).filter;
      api.add('photos are never inverted', filter === 'none' || filter === '',
        'img filter = ' + filter);
    };
  </script>
  <script src="./assert.js"></script>
</body>

</html>
