<!DOCTYPE html>
<html lang="en" data-dr-expect="dark" data-dr-settle="1400">

<head>
  <meta charset="utf-8">
  <title>Darkrai fixture: text that is hard to read after darkening</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #ffffff;
      color: #222222;
      font: 15px/1.6 system-ui, sans-serif;
    }

    .row {
      max-width: 560px;
      margin-bottom: 10px;
      padding: 10px 12px;
    }

    /* Mid grey on mid grey: readable enough in the light original, and the
       straight colour transform alone would leave it under 4.5:1. The
       readability guard has to step in. */
    .grey-on-grey {
      background: #808080;
      color: #777777;
    }

    .faint {
      background: #ffffff;
      color: #bbbbbb;
    }

    .fainter {
      background: #f5f5f5;
      color: #d0d0d0;
    }

    .dark-on-dark {
      background: #2a2a2a;
      color: #333333;
    }

    .big {
      font-size: 26px;
    }

    .bold-large {
      font-size: 19px;
      font-weight: 700;
    }

    .tinted {
      background: #e8f5e9;
      color: #a5d6a7;
    }
  </style>
  <script>window.__DR_SHIM__ = {};</script>
  <script src="../shim/chrome-shim.js"></script>
</head>

<body>
  <h1>Low contrast on purpose</h1>
  <div class="row grey-on-grey">Grey text on a grey panel.</div>
  <div class="row faint">Very faint grey on white.</div>
  <div class="row fainter">Fainter still, on near-white.</div>
  <div class="row dark-on-dark">Dark text on a dark panel.</div>
  <div class="row faint big">Large faint text, which only needs 3:1.</div>
  <div class="row faint bold-large">Bold 19px faint text, also 3:1.</div>
  <div class="row tinted">Pale green on pale green.</div>

  <script src="../../extension/shared/timing.js"></script>
  <script src="../../extension/shared/color.js"></script>
  <script src="../../extension/shared/settings.js"></script>
  <script src="../../extension/shared/restricted.js"></script>
  <script src="../../extension/content/detect.js"></script>
  <script src="../../extension/content/engine-smart.js"></script>
  <script src="../../extension/content/engine-simple.js"></script>
  <script src="../../extension/content/readability.js"></script>
  <script src="../../extension/content/icons.js"></script>
  <script src="../../extension/content/picker.js"></script>
  <script src="../../extension/content/main.js"></script>
  <script src="./assert.js"></script>
</body>

</html>
